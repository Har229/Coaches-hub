<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coaches Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e1a;color:#fff;min-height:100vh}
  @media print{.no-print{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const ACCENT = "#00c9ff";
const ACCENT2 = "#e63946";
const DARK = "#0a0e1a";
const CARD = "#111827";
const BORDER = "#1e2d45";

const AGE_GROUPS = ["U6","U7","U8","U9","U10","U11","U12","U13","U14","U15","U16"];
const DURATIONS = ["30 mins","45 mins","60 mins","75 mins","90 mins"];
const PLAYER_COUNTS = ["4","5","6","7","8","9","10","11","12","14","16","18","20+"];
const FOCUS_AREAS = [
  "Dribbling & Ball Control","Passing & Receiving","Shooting & Finishing",
  "Defending & Tackling","Movement & Positioning","Teamwork & Communication",
  "1v1 Skills","Crossing & Heading","Pre-Match Warm Up & Warm Down"
];

const PHASE_STYLES = [
  {bg:"#0d1f3c",border:"#1a56db",label:"#60a5fa"},
  {bg:"#1a1200",border:"#d97706",label:"#fbbf24"},
  {bg:"#051a0d",border:"#059669",label:"#34d399"},
  {bg:"#1a0a14",border:"#db2777",label:"#f472b6"},
];

function Tag({children, active, color, onClick, disabled}){
  return (
    <button onClick={onClick} disabled={disabled} style={{
      padding:"6px 14px",borderRadius:20,fontSize:13,cursor:disabled?"not-allowed":"pointer",
      border:`1.5px solid ${active ? color : "#2a3a55"}`,
      background:active ? color : "transparent",
      color:active ? "#fff" : disabled ? "#334" : "#8899bb",
      fontWeight:active?600:400,transition:"all 0.15s",
      opacity:disabled?0.4:1
    }}>{children}</button>
  );
}

function SessionPlanner(){
  const [ageGroup,setAgeGroup]=useState("");
  const [duration,setDuration]=useState("");
  const [playerCount,setPlayerCount]=useState("");
  const [focus,setFocus]=useState([]);
  const [loading,setLoading]=useState(false);
  const [plan,setPlan]=useState(null);
  const [error,setError]=useState("");

  const toggleFocus = f => {
    if(focus.includes(f)) setFocus(focus.filter(x=>x!==f));
    else if(focus.length<2) setFocus([...focus,f]);
  };

  const generate = async () => {
    if(!ageGroup||!duration||!playerCount||focus.length===0){
      setError("Please complete all selections before generating.");return;
    }
    setError("");setLoading(true);setPlan(null);
    const ageNum=parseInt(ageGroup.replace("U",""));
    const ageCtx=ageNum<=8?"fun-first, games-based, short attention spans":ageNum<=11?"balance of fun and learning, simple drills":"tactical awareness, structured drills, competitive";
    const isMatchDay = focus.includes("Pre-Match Warm Up & Warm Down");
    const prompt = isMatchDay
      ? `FA grassroots coach UK. Create a match day routine for ${ageGroup}, ${playerCount} players, ${duration} total. Age context: ${ageCtx}. Split into: Pre-Match Warm Up and Post-Match Warm Down. Apply FA Four Corner Model per phase. Max 15 words per string value. Return ONLY minified JSON, no markdown:
{"sessionTitle":"","coachingTip":"","phases":[{"name":"Pre-Match Warm Up","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Dynamic Activation","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Post-Match Warm Down","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Recovery & Reflection","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}}]}`
      : `FA grassroots coach UK. Create a ${duration} football session for ${ageGroup}, ${playerCount} players, focus: ${focus.join(" & ")}. Age context: ${ageCtx}. Apply FA Four Corner Model per phase. Max 15 words per string value. Return ONLY minified JSON, no markdown:
{"sessionTitle":"","coachingTip":"","phases":[{"name":"Warm-up","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Main Drill","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Small-Sided Game","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}},{"name":"Cool-down","duration":"","activity":"","description":"","funElement":"","equipment":"","fourCorners":{"technical":"","physical":"","psychological":"","social":""}}]}`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:prompt}]})
      });
      if(!res.ok) throw new Error(`API error ${res.status}`);
      const data=await res.json();
      const raw=data.content?.map(b=>b.text||"").join("").trim();
      const match=raw.match(/\{[\s\S]*\}/);
      if(!match) throw new Error("No JSON in response");
      setPlan(JSON.parse(match[0]));
    }catch(e){setError(`Could not generate: ${e.message}. Please try again.`);}
    setLoading(false);
  };

  const reset=()=>{setPlan(null);setAgeGroup("");setDuration("");setPlayerCount("");setFocus([]);};

  return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"0 1rem 3rem"}}>
      {!plan ? (
        <div>
          {/* Form card */}
          <div style={{background:CARD,border:`1px solid ${BORDER}`,borderRadius:16,padding:"1.75rem",marginBottom:16}}>

            <Section label="Age group">
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {AGE_GROUPS.map(a=><Tag key={a} active={ageGroup===a} color={ACCENT} onClick={()=>setAgeGroup(a)}>{a}</Tag>)}
              </div>
            </Section>

            <Section label="Number of players">
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {PLAYER_COUNTS.map(p=><Tag key={p} active={playerCount===p} color={ACCENT} onClick={()=>setPlayerCount(p)}>{p}</Tag>)}
              </div>
            </Section>

            <Section label="Session duration">
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {DURATIONS.map(d=><Tag key={d} active={duration===d} color={ACCENT} onClick={()=>setDuration(d)}>{d}</Tag>)}
              </div>
            </Section>

            <Section label="Focus area" hint="pick 1 or 2">
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {FOCUS_AREAS.map(f=><Tag key={f} active={focus.includes(f)} color={ACCENT2} onClick={()=>toggleFocus(f)} disabled={!focus.includes(f)&&focus.length>=2}>{f}</Tag>)}
              </div>
            </Section>

            {error&&<div style={{color:"#f87171",fontSize:13,marginTop:12,padding:"10px 14px",background:"rgba(239,68,68,0.1)",borderRadius:8,border:"1px solid rgba(239,68,68,0.3)"}}>{error}</div>}

            <button onClick={generate} disabled={loading} style={{
              marginTop:20,width:"100%",padding:"14px",borderRadius:10,
              background:loading?"#1e2d45":`linear-gradient(135deg, #1a56db, ${ACCENT})`,
              color:"#fff",border:"none",fontSize:15,fontWeight:600,cursor:loading?"not-allowed":"pointer",
              letterSpacing:"0.3px"
            }}>
              {loading?"Generating session plan...":"Generate session plan"}
            </button>
          </div>

          {loading&&(
            <div style={{textAlign:"center",padding:"2rem",color:"#8899bb",fontSize:14}}>
              <div style={{fontSize:32,marginBottom:10}}>⚽</div>
              Building your {ageGroup} · {playerCount} players · {duration} · {focus.join(" & ")} plan...
            </div>
          )}
        </div>
      ) : (
        <div>
          {/* Plan header */}
          <div style={{background:`linear-gradient(135deg, #0d1f3c, #1a2a5e)`,border:`1px solid #1a56db`,borderRadius:16,padding:"1.5rem 1.75rem",marginBottom:16}}>
            <div style={{fontSize:12,color:"#60a5fa",marginBottom:6,letterSpacing:"0.5px"}}>{ageGroup} · {playerCount} PLAYERS · {duration} · {focus.join(" & ").toUpperCase()}</div>
            <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>{plan.sessionTitle}</div>
          </div>

          {plan.coachingTip&&(
            <div style={{background:"#1a1200",border:"1px solid #d97706",borderRadius:12,padding:"1rem 1.25rem",marginBottom:16,display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{fontSize:20,flexShrink:0}}>💡</div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:"#fbbf24",marginBottom:4,letterSpacing:"0.5px"}}>COACHING TIP</div>
                <div style={{fontSize:14,color:"#fde68a",lineHeight:1.6}}>{plan.coachingTip}</div>
              </div>
            </div>
          )}

          <div style={{display:"grid",gap:12,marginBottom:16}}>
            {plan.phases?.map((phase,i)=>{
              const s=PHASE_STYLES[i%PHASE_STYLES.length];
              return(
                <div key={i} style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:14,padding:"1.25rem 1.5rem"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <span style={{fontSize:11,fontWeight:600,color:s.label,letterSpacing:"0.8px",background:"rgba(255,255,255,0.06)",borderRadius:20,padding:"3px 12px"}}>{phase.name.toUpperCase()}</span>
                    <span style={{fontSize:12,color:"#6b7280"}}>{phase.duration}</span>
                  </div>
                  <div style={{fontSize:16,fontWeight:600,color:"#f1f5f9",marginBottom:8}}>{phase.activity}</div>
                  <div style={{fontSize:13,color:"#94a3b8",lineHeight:1.7,marginBottom:10}}>{phase.description}</div>
                  {phase.funElement&&(
                    <div style={{fontSize:13,color:s.label,background:"rgba(255,255,255,0.05)",borderRadius:8,padding:"8px 12px",marginBottom:10}}>
                      <span style={{fontWeight:600}}>Fun element: </span>{phase.funElement}
                    </div>
                  )}
                  {phase.fourCorners&&(
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:11,fontWeight:600,color:s.label,letterSpacing:"0.5px",marginBottom:8}}>FA FOUR CORNER MODEL</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                        {[{k:"technical",l:"Technical",e:"⚽"},{k:"physical",l:"Physical",e:"🏃"},{k:"psychological",l:"Psychological",e:"🧠"},{k:"social",l:"Social",e:"🤝"}].map(({k,l,e})=>(
                          <div key={k} style={{background:"rgba(0,0,0,0.25)",borderRadius:8,padding:"8px 10px"}}>
                            <div style={{fontSize:11,fontWeight:600,color:s.label,marginBottom:3}}>{e} {l}</div>
                            <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.5}}>{phase.fourCorners[k]}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {phase.equipment&&<div style={{fontSize:12,color:"#6b7280"}}><span style={{fontWeight:600,color:"#94a3b8"}}>Equipment: </span>{phase.equipment}</div>}
                </div>
              );
            })}
          </div>

          <button onClick={()=>window.print()} className="no-print" style={{
            width:"100%",padding:"12px",borderRadius:10,marginBottom:10,
            background:`linear-gradient(135deg,${ACCENT2},#c1121f)`,color:"#fff",
            border:"none",fontSize:14,fontWeight:600,cursor:"pointer"
          }}>Save as PDF</button>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}} className="no-print">
            <button onClick={generate} style={{padding:"11px",borderRadius:10,background:`linear-gradient(135deg,#1a56db,${ACCENT})`,color:"#fff",border:"none",fontSize:14,fontWeight:600,cursor:"pointer"}}>Regenerate</button>
            <button onClick={reset} style={{padding:"11px",borderRadius:10,background:"transparent",color:"#8899bb",border:`1px solid ${BORDER}`,fontSize:14,cursor:"pointer"}}>New session</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Section({label,hint,children}){
  return(
    <div style={{marginBottom:20}}>
      <div style={{fontSize:13,fontWeight:600,color:"#8899bb",marginBottom:10,letterSpacing:"0.4px",display:"flex",gap:8,alignItems:"center"}}>
        {label.toUpperCase()}
        {hint&&<span style={{fontSize:11,fontWeight:400,color:"#445",background:"#1e2d45",borderRadius:20,padding:"2px 8px"}}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function App(){
  return(
    <div>
      {/* Top nav */}
      <nav style={{background:"rgba(10,14,26,0.95)",borderBottom:`1px solid ${BORDER}`,padding:"0 1.5rem",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(10px)"}} className="no-print">
        <div style={{maxWidth:700,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:56}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{background:`linear-gradient(135deg,#1a56db,${ACCENT})`,borderRadius:8,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚽</div>
            <span style={{fontWeight:700,fontSize:16,letterSpacing:"0.3px"}}>Coaches<span style={{color:ACCENT}}>Hub</span></span>
          </div>
          <div style={{fontSize:12,color:"#445",background:"#111827",border:`1px solid ${BORDER}`,borderRadius:20,padding:"4px 12px"}}>Session Planner</div>
        </div>
      </nav>

      {/* Hero */}
      <div style={{background:`linear-gradient(180deg, #0d1a3a 0%, ${DARK} 100%)`,padding:"3rem 1rem 2.5rem",textAlign:"center",borderBottom:`1px solid ${BORDER}`}} className="no-print">
        <div style={{fontSize:12,fontWeight:600,color:ACCENT,letterSpacing:"2px",marginBottom:12}}>FA FOUR CORNER MODEL · GRASSROOTS FOOTBALL</div>
        <h1 style={{fontSize:"clamp(26px,5vw,42px)",fontWeight:800,lineHeight:1.15,marginBottom:14}}>
          Build better<br/><span style={{background:`linear-gradient(90deg,${ACCENT},#818cf8)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>training sessions</span>
        </h1>
        <p style={{fontSize:15,color:"#8899bb",maxWidth:420,margin:"0 auto"}}>AI-powered session plans tailored to your players' age, squad size and focus area — in seconds.</p>
      </div>

      {/* Planner */}
      <div style={{padding:"2rem 0"}}>
        <SessionPlanner/>
      </div>

      {/* Footer */}
      <footer style={{borderTop:`1px solid ${BORDER}`,padding:"1.5rem",textAlign:"center",color:"#334"}} className="no-print">
        <div style={{fontSize:12}}>CoachesHub · Powered by Claude AI · Built for grassroots football</div>
      </footer>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
